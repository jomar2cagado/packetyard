<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Packetyard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen lab bench. Toolbar on top, topology canvas left, inspector panel right; stacks on phones. */
:root{
  --bg:#e9edef; --canvas:#f5f7f8; --panel:#ffffff; --ink:#18222a; --muted:#5a6873; --line:#cdd5da; --grid:#d3dbe0;
  --accent:#0a7570; --accent-ink:#ffffff; --accent-soft:#d5ecea;
  --pc:#36597f; --sw:#3f6b4b; --rt:#8a4f2c;
  --arp:#a96f08; --icmp:#2b62c4; --err:#c23a30; --ok:#258552; --dhcp:#7a45b8; --rip:#0f7f8f; --sw-ev:#3f6b4b; --mute:#8794a0;
  --l2:#0a7570; --l3:#5a4bb0; --l4:#2b62c4;
  --term-bg:#0e1417; --term-fg:#cfe2d6; --term-dim:#6d8a7c;
  --shadow:0 6px 24px rgba(20,35,45,.12);
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1215; --canvas:#11181c; --panel:#161e23; --ink:#e2e9ec; --muted:#91a2ac; --line:#2a363d; --grid:#1f2a30;
  --accent:#3cb5ab; --accent-ink:#06201e; --accent-soft:#16312f;
  --pc:#8db0db; --sw:#8fc39b; --rt:#e3a37b;
  --arp:#e2a93b; --icmp:#6e9df2; --err:#f06b60; --ok:#4cc184; --dhcp:#b58cf0; --rip:#4cc6d6; --sw-ev:#8fc39b; --mute:#6f7f89;
  --l2:#3cb5ab; --l3:#a596f0; --l4:#6e9df2;
  --term-bg:#080c0e; --term-fg:#cfe2d6; --term-dim:#5f7a6d; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1215; --canvas:#11181c; --panel:#161e23; --ink:#e2e9ec; --muted:#91a2ac; --line:#2a363d; --grid:#1f2a30;
  --accent:#3cb5ab; --accent-ink:#06201e; --accent-soft:#16312f;
  --pc:#8db0db; --sw:#8fc39b; --rt:#e3a37b;
  --arp:#e2a93b; --icmp:#6e9df2; --err:#f06b60; --ok:#4cc184; --dhcp:#b58cf0; --rip:#4cc6d6; --sw-ev:#8fc39b; --mute:#6f7f89;
  --l2:#3cb5ab; --l3:#a596f0; --l4:#6e9df2;
  --term-bg:#080c0e; --term-fg:#cfe2d6; --term-dim:#5f7a6d; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:8px;padding-block:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px}
.brand b{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.grp{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:0 6px;cursor:pointer}
.speed{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 6px}
.speed input{width:80px;accent-color:var(--accent)}
.clock{font:500 12px var(--mono);color:var(--muted);padding:0 8px;font-variant-numeric:tabular-nums;min-width:70px}
select.sel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;font-size:13px;max-width:220px}
.hint{font-size:12.5px;color:var(--muted);min-height:18px}
.hint kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel)}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;min-height:0}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--canvas);overflow:hidden;min-height:0}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.tab{border:0;background:none;padding:11px 12px 9px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font:500 10.5px var(--mono);background:var(--accent-soft);color:var(--ink);border-radius:9px;padding:1px 6px}
.pane{flex:1;overflow:auto;min-height:0;padding:14px;display:flex;flex-direction:column;gap:14px}
.pane>*{flex-shrink:0}
.empty{color:var(--muted);font-size:13.5px;line-height:1.55;padding:6px 2px}
.empty b{color:var(--ink)}
/* SVG */
.gridbg{fill:var(--grid)}
.wire{stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
.wire.down{stroke-dasharray:6 6;opacity:.6}
.link .hit{stroke:transparent;stroke-width:16;cursor:pointer}
.mode-delete .link:hover .wire{stroke:var(--err)}
.ldot{stroke:var(--canvas);stroke-width:2}
.ldot.up{fill:var(--ok)}.ldot.dn{fill:var(--err)}
.llab{font:500 10.5px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}
.dev{cursor:grab}
.dev .hitbox{fill:transparent}
.dev .body{fill:var(--panel);stroke-width:2.2}
.dev .glyph{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dev .scr{opacity:.18}
.dev.pc .body,.dev.pc .glyph{stroke:var(--pc)} .dev.pc .scr{fill:var(--pc)}
.dev.switch .body,.dev.switch .glyph{stroke:var(--sw)}
.dev.router .body,.dev.router .glyph{stroke:var(--rt)}
.dname{font:600 13px var(--ui);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--canvas);stroke-width:4px}
.dsub{font:500 10.5px var(--mono);fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--canvas);stroke-width:4px}
.selring{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4}
.linkfrom .selring{stroke:var(--arp)}
.mode-delete .dev:hover .body{stroke:var(--err)}
.pkt{cursor:pointer}
.pkt rect{stroke:var(--canvas);stroke-width:1.5}
.pkt path{fill:none;stroke:var(--canvas);stroke-width:1.4}
.pkt.arp rect{fill:var(--arp)}.pkt.icmp rect{fill:var(--icmp)}.pkt.err rect{fill:var(--err)}.pkt.dhcp rect{fill:var(--dhcp)}.pkt.rip rect{fill:var(--rip)}
.pkt .ring{fill:none;stroke:var(--ink);stroke-width:2}
/* narration */
.narr{position:absolute;left:12px;bottom:12px;width:min(460px,calc(100% - 24px));max-height:min(60%,460px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.narr.min{max-height:none;width:auto}
.narr.min .nbody{display:none}
.nhead{display:flex;align-items:center;gap:8px}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.nhead .sp{flex:1}
.ntitle{font-size:16px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.nbody{display:flex;flex-direction:column;gap:9px}
.nbody p{margin:0;font-size:13.5px;color:var(--ink);max-width:62ch}
.stepbox{border:1px dashed var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.stepbox code,.cmd{font:500 12px var(--mono);background:var(--accent-soft);padding:1px 5px;border-radius:4px;white-space:pre-wrap}
.nlines{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.nlines li{font-size:13px;line-height:1.45;padding-left:10px;border-left:3px solid var(--mute)}
.nlines li b{font-weight:600}
.c-arp{border-color:var(--arp)!important}.c-icmp{border-color:var(--icmp)!important}.c-err{border-color:var(--err)!important}.c-sw{border-color:var(--sw-ev)!important}.c-dhcp{border-color:var(--dhcp)!important}.c-rip{border-color:var(--rip)!important}.c-ok{border-color:var(--ok)!important}
.nbtns{display:flex;flex-wrap:wrap;gap:6px}
.nbtns .btn{border:1px solid var(--line)}
/* device pane */
.dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dhead input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--canvas);font-weight:600;width:130px}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.term{background:var(--term-bg);color:var(--term-fg);border-radius:9px;font:13px/1.45 var(--mono);display:flex;flex-direction:column;min-height:240px;height:300px;resize:vertical;overflow:hidden}
.tout{flex:1;overflow:auto;padding:10px 12px 0;white-space:pre-wrap;word-break:break-word;margin:0;font:inherit}
.tin{display:flex;align-items:center;padding:2px 12px 10px;gap:0}
.tin label{color:var(--term-fg);white-space:pre}
.tin input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--term-fg);font:inherit;caret-color:var(--term-fg);padding:0}
.qcfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:end}
.qcfg label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.qcfg input{border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--canvas);font:12px var(--mono);min-width:0;width:100%}
.qcfg .btn{border:1px solid var(--line)}
h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font:12px var(--mono);font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font:600 10.5px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl .none{color:var(--muted);font-family:var(--ui)}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.st.up{background:var(--ok)}.st.dn{background:var(--err)}
.sec{display:flex;flex-direction:column;gap:6px}
/* inspector */
.isum{display:flex;flex-direction:column;gap:4px}
.isum .t{font-weight:700;font-size:15px}
.isum .h{font:12px var(--mono);color:var(--muted)}
.layer{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.layer summary{cursor:pointer;padding:7px 10px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;list-style:none}
.layer summary::-webkit-details-marker{display:none}
.layer summary i{width:10px;height:10px;border-radius:2px;flex:none}
.layer .rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.frow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;padding:4px 10px;font-size:12.5px;cursor:default}
.frow:hover{background:var(--accent-soft)}
.frow .k{color:var(--muted)}
.frow .v{font-family:var(--mono);font-size:12px;word-break:break-word}
.frow .n{grid-column:2;font-size:11.5px;color:var(--muted);font-family:var(--ui)}
.L-l2{background:var(--l2)}.L-l3{background:var(--l3)}.L-l4{background:var(--l4)}.L-arp{background:var(--arp)}.L-dhcp{background:var(--dhcp)}.L-rip{background:var(--rip)}.L-pad{background:var(--mute)}
.hex{font:12px/1.6 var(--mono);overflow:auto;max-height:260px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre}
.hex .off{color:var(--muted);margin-right:10px}
.hex span.b{padding:0 1px;border-radius:2px}
.hex .b.l2{color:var(--l2)}.hex .b.l3{color:var(--l3)}.hex .b.l4{color:var(--l4)}.hex .b.arp{color:var(--arp)}.hex .b.dhcp{color:var(--dhcp)}.hex .b.rip{color:var(--rip)}.hex .b.pad{color:var(--mute)}
.hex .b.hl{background:var(--ink);color:var(--panel)}
/* events */
.evtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.evlist{display:flex;flex-direction:column;font-size:12.5px}
.ev{display:grid;grid-template-columns:52px 44px minmax(0,1fr);gap:8px;padding:5px 6px 5px 8px;border-left:3px solid var(--mute);border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.ev:hover{background:var(--accent-soft)}
.ev .tm{font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ev .dv{font-weight:600}
.ev .tx{font-family:var(--mono);font-size:11.5px;word-break:break-word}
.ev.sel{background:var(--accent-soft)}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(10,18,22,.45);display:grid;place-items:center;padding:16px;z-index:20}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(640px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.mbox textarea{width:100%;height:280px;font:12px var(--mono);border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--canvas);resize:vertical}
.mbox .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbox .btn{border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:980px){
  html,body{height:auto}
  #app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{height:64vh;min-height:380px}
  .pane{max-height:none;overflow:visible}
  .narr{max-height:48%}
}
@media (max-width:520px){ .btn .lbl{display:none} .brand span{display:none} .qcfg{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <div class="brand"><b>Packetyard</b><span>network lab</span></div>
    <div class="grp" role="toolbar" aria-label="Tools">
      <button class="btn" data-tool="select" aria-pressed="true" title="Select and move (V)"><svg viewBox="0 0 16 16"><path d="M3 2l9 5-4 1.2L6.5 12z" fill="currentColor"/></svg><span class="lbl">Select</span></button>
      <button class="btn" data-tool="pc" title="Add PC"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="8" rx="1"/><path d="M6 13.5h4M8 10.5v3"/></svg><span class="lbl">PC</span></button>
      <button class="btn" data-tool="switch" title="Add switch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="4.5" width="13" height="7" rx="1.5"/><path d="M4 7h7l-1.5-1.3M12 9H5l1.5 1.3"/></svg><span class="lbl">Switch</span></button>
      <button class="btn" data-tool="router" title="Add router"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><path d="M4.5 8h7M8 4.5v7"/></svg><span class="lbl">Router</span></button>
      <button class="btn" data-tool="link" title="Connect two devices with a cable (L)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3.5" cy="12.5" r="1.8"/><circle cx="12.5" cy="3.5" r="1.8"/><path d="M5 11l6-6"/></svg><span class="lbl">Cable</span></button>
      <button class="btn" data-tool="delete" title="Delete device or cable"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9"/></svg><span class="lbl">Delete</span></button>
    </div>
    <div class="grp" aria-label="Simulation">
      <button class="btn" id="playBtn" title="Play or pause the simulation"></button>
      <button class="btn" id="stepBtn" title="Advance until the next packet arrives"><svg viewBox="0 0 16 16"><path d="M3 3l7 5-7 5zM11 3h2v10h-2z" fill="currentColor"/></svg><span class="lbl">Next hop</span></button>
      <label class="chk" title="Pause every time a packet reaches a device"><input type="checkbox" id="stepMode"> Pause each hop</label>
      <label class="speed">Speed <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1" aria-label="Simulation speed"><span id="speedVal">1×</span></label>
      <span class="clock" id="clock">t 0.0 s</span>
    </div>
    <div class="grp">
      <select class="sel" id="demoSel" aria-label="Guided demos">
        <option value="">Guided demos…</option>
      </select>
      <button class="btn" id="resetBtn" title="Clear packets, ARP caches, MAC tables, leases and learned routes">Reset tables</button>
      <button class="btn" id="fileBtn" title="Copy or load a topology as JSON">Save / load</button>
    </div>
  </header>
  <div class="hint" id="hint"></div>
  <main>
    <section class="stage" id="stage">
      <svg id="svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" aria-label="Network topology">
        <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" class="gridbg"/></pattern></defs>
        <rect x="-2000" y="-2000" width="5200" height="4720" fill="url(#dots)" id="bg"/>
        <g id="gLinks"></g><g id="gDevs"></g><g id="gPkts"></g>
      </svg>
      <div class="narr" id="narr"></div>
    </section>
    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="device" aria-selected="true">Device</button>
        <button class="tab" role="tab" data-tab="packet" aria-selected="false">Packet</button>
        <button class="tab" role="tab" data-tab="events" aria-selected="false">Events <span class="badge" id="evCount">0</span></button>
      </nav>
      <div class="pane" id="pane-device"></div>
      <div class="pane" id="pane-packet" hidden></div>
      <div class="pane" id="pane-events" hidden>
        <div class="evtools" id="evTools">
          <button class="chip" data-f="all" aria-pressed="true">All</button>
          <button class="chip" data-f="arp" aria-pressed="false">ARP</button>
          <button class="chip" data-f="icmp" aria-pressed="false">ICMP</button>
          <button class="chip" data-f="sw" aria-pressed="false">Switching</button>
          <button class="chip" data-f="dhcp" aria-pressed="false">DHCP</button>
          <button class="chip" data-f="rip" aria-pressed="false">RIP</button>
          <button class="chip" data-f="err" aria-pressed="false">Errors</button>
          <button class="chip" id="evClear">Clear</button>
        </div>
        <div class="evlist" id="evList"></div>
      </div>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden>
  <div class="mbox" role="dialog" aria-label="Save or load topology">
    <h3>Topology JSON</h3>
    <p class="empty" style="padding:0">Copy this text to keep your lab, or paste a saved lab and press Load.</p>
    <textarea id="jsonBox" spellcheck="false" aria-label="Topology JSON"></textarea>
    <div class="row">
      <button class="btn" id="newBtn">Empty canvas</button>
      <button class="btn" id="copyBtn">Copy</button>
      <button class="btn" id="loadBtn">Load</button>
      <button class="btn primary" id="closeBtn">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HOP_MS=1100, BCAST='ff:ff:ff:ff:ff:ff', ZMAC='00:00:00:00:00:00', RIPMAC='01:00:5e:00:00:09';
const PING_TIMEOUT=20000, ARP_TIMEOUT=8000, RIP_INT=12000, DHCP_TIMEOUT=15000;

/* ---------- address helpers ---------- */
const validIp=s=>/^(\d{1,3}\.){3}\d{1,3}$/.test(s||'')&&s.split('.').every(o=>+o<=255);
const ip2n=s=>s.split('.').reduce((a,o)=>a*256+(+o),0)>>>0;
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const len2mask=l=>n2ip(l<=0?0:(0xffffffff<<(32-l))>>>0);
const mask2len=m=>{let n=ip2n(m),c=0;while(c<32&&(n&0x80000000)){c++;n=(n<<1)>>>0}return c};
const validMask=m=>validIp(m)&&len2mask(mask2len(m))===m;
const netOf=(ip,m)=>n2ip((ip2n(ip)&ip2n(m))>>>0);
const inNet=(ip,net,m)=>((ip2n(ip)&ip2n(m))>>>0)===((ip2n(net)&ip2n(m))>>>0);
const classful=n=>{const o=+n.split('.')[0];return o<128?'255.0.0.0':o<192?'255.255.0.0':'255.255.255.0'};
const rh=()=>Math.floor(Math.random()*256).toString(16).padStart(2,'0');
const newMac=()=>['02','ac',rh(),rh(),rh(),rh()].join(':');
const macDot=m=>{const h=m.replace(/:/g,'');return h.slice(0,4)+'.'+h.slice(4,8)+'.'+h.slice(8)};
function parseCidr(a,b){ // "1.2.3.4/24" or ("1.2.3.4","255.255.255.0"|"24"|"/24")
  if(a&&a.includes('/')){const [ip,l]=a.split('/');return validIp(ip)&&+l>=0&&+l<=32?{ip,mask:len2mask(+l)}:null}
  if(!validIp(a)) return null;
  if(validMask(b)) return {ip:a,mask:b};
  const l=String(b||'').replace('/','');
  if(/^\d+$/.test(l)&&+l<=32) return {ip:a,mask:len2mask(+l)};
  return null;
}

/* ---------- state ---------- */
const S={devices:[],links:[],nextId:1};
const sim={t:0,running:true,speed:1,stepMode:false,stepOnce:false,packets:[],timers:[],pid:1,fid:1,ident:4100};
let tool='select', selId=null, linkFrom=null, inspected=null, events=[], evFilter='all', topoDirty=true, panelDirty=true, narrDirty=true, tab='device';
const narr={demo:null,step:0,lines:[],min:false};

const dev=id=>S.devices.find(d=>d.id===id);
const devByName=n=>S.devices.find(d=>d.name.toLowerCase()===String(n).toLowerCase());
const linkAt=(d,ifi)=>S.links.find(l=>(l.a.dev===d.id&&l.a.ifi===ifi)||(l.b.dev===d.id&&l.b.ifi===ifi));
function peer(l,d,ifi){const e=(l.a.dev===d.id&&l.a.ifi===ifi)?l.b:l.a;return {d:dev(e.dev),ifi:e.ifi}}
function ifOper(d,ifi){const i=d.ifaces[ifi];if(!i||!i.up)return false;const l=linkAt(d,ifi);if(!l)return false;const p=peer(l,d,ifi);return !!(p.d&&p.d.ifaces[p.ifi].up)}
const after=(ms,fn)=>sim.timers.push({at:sim.t+ms,fn});

const IFN={pc:()=>['eth0'],switch:()=>Array.from({length:8},(_,i)=>'Fa0/'+(i+1)),router:()=>['Gi0/0','Gi0/1','Gi0/2','Gi0/3']};
const LONG={Gi:'GigabitEthernet',Fa:'FastEthernet'};
const longIf=n=>n.replace(/^(Gi|Fa)/,m=>LONG[m]);
const PREFIX={pc:'PC',switch:'SW',router:'R'};
function runtime(d){
  d.arp={};d.mact={};d.pending=[];d.arpWait={};d.session=null;d.ripRoutes=[];d.bindings={};d.dhcpc=null;d.ripNext=0;
  d.routes=d.routes||[];d.gw=d.gw||'';d.rip=d.rip||{on:false,nets:[]};d.dhcp=d.dhcp||{pools:[],excluded:[]};
  if(!d.term){d.term={lines:[],hist:[],hi:0,mode:'user',sub:null};
    d.term.lines.push(d.type==='pc'?`${d.name} console. Type help for commands.`:`${d.type==='router'?'Router':'Switch'} console. Type ? for commands.`);
    if(d.type==='router') d.term.lines.push('Interfaces start shut down. Use: enable, configure terminal, interface gi0/0, ip address …, no shutdown.');}
  return d;
}
function nextName(type){const p=PREFIX[type];let n=0;S.devices.forEach(d=>{const m=d.name.match(new RegExp('^'+p+'(\\d+)$'));if(m)n=Math.max(n,+m[1])});return p+(n+1)}
function addDev(type,x,y,name){
  const d=runtime({id:'d'+S.nextId++,type,name:name||nextName(type),x,y,ifaces:IFN[type]().map(n=>({name:n,mac:newMac(),ip:'',mask:'',up:type!=='router'}))});
  S.devices.push(d);topoDirty=true;save();return d;
}
function freeIf(d){return d.ifaces.findIndex((_,i)=>!linkAt(d,i))}
function connect(a,b,ai,bi){
  if(a===b) return null;
  ai=ai??freeIf(a);bi=bi??freeIf(b);
  if(ai<0){toast(`${a.name} has no free ports.`);return null}
  if(bi<0){toast(`${b.name} has no free ports.`);return null}
  const l={id:'l'+S.nextId++,a:{dev:a.id,ifi:ai},b:{dev:b.id,ifi:bi}};S.links.push(l);topoDirty=true;panelDirty=true;save();
  [a,b].forEach(d=>{if(d.rip.on)d.ripNext=sim.t+400});
  return l;
}
function removeLink(l){S.links=S.links.filter(x=>x!==l);sim.packets=sim.packets.filter(p=>p.link!==l.id);topoDirty=panelDirty=true;save()}
function removeDev(d){S.links.filter(l=>l.a.dev===d.id||l.b.dev===d.id).forEach(removeLink);S.devices=S.devices.filter(x=>x!==d);if(selId===d.id)selId=null;topoDirty=panelDirty=true;save()}

/* ---------- persistence ---------- */
function serialize(){return {app:'packetyard',v:1,devices:S.devices.map(d=>({id:d.id,type:d.type,name:d.name,x:Math.round(d.x),y:Math.round(d.y),gw:d.gw,routes:d.routes,rip:d.rip,dhcp:d.dhcp,dhcpClient:!!d.dhcpClient,ifaces:d.ifaces.map(i=>({name:i.name,mac:i.mac,ip:i.ip,mask:i.mask,up:i.up}))})),links:S.links.map(l=>({id:l.id,a:l.a,b:l.b}))}}
function load(o){
  if(!o||!Array.isArray(o.devices)) throw new Error('bad');
  clearAll();
  S.devices=o.devices.map(d=>runtime({...d,routes:(d.routes||[]).map(r=>({...r})),ifaces:d.ifaces.map(i=>({...i}))}));
  S.links=(o.links||[]).map(l=>({id:l.id,a:{...l.a},b:{...l.b}}));
  let mx=0;[...S.devices,...S.links].forEach(x=>{const n=+String(x.id).slice(1);if(n>mx)mx=n});S.nextId=mx+1;
  S.devices.forEach(d=>{if(d.rip.on)d.ripNext=600});
  topoDirty=panelDirty=true;save();
}
function save(){try{localStorage.setItem('packetyard.topo',JSON.stringify(serialize()))}catch(e){}}
function clearAll(){S.devices=[];S.links=[];S.nextId=1;sim.packets=[];sim.timers=[];selId=null;inspected=null;linkFrom=null;events=[];renderEvents(true);topoDirty=panelDirty=narrDirty=true}
function resetTables(){
  sim.packets=[];sim.timers=[];
  S.devices.forEach(d=>{d.arp={};d.mact={};d.pending=[];d.arpWait={};d.session=null;d.ripRoutes=[];d.bindings={};d.dhcpc=null;if(d.rip.on)d.ripNext=sim.t+500});
  topoDirty=panelDirty=narrDirty=true;
}

/* ---------- logging ---------- */
function log(d,text,o={}){
  const e={t:sim.t,dev:d?d.name:'',text,frame:o.frame||null,cls:o.cls||'mute',explain:o.explain||null};
  events.push(e);if(events.length>600)events.shift();
  appendEvent(e);
  if(e.explain){narr.lines.push({who:e.dev,text:e.explain,cls:e.cls});const cap=sim.stepMode?8:3;while(narr.lines.length>cap)narr.lines.shift();narrDirty=true}
}

/* ---------- frames ---------- */
const ICMPN={0:'Echo Reply',8:'Echo Request',11:'Time Exceeded',3:'Destination Unreachable'};
function fsum(f){
  if(f.arp) return f.arp.op===1?`ARP Who has ${f.arp.tpa}? Tell ${f.arp.spa}`:`ARP ${f.arp.spa} is at ${f.arp.sha}`;
  const p=f.ip;
  if(p.icmp) return `ICMP ${ICMPN[p.icmp.type]} ${p.src} → ${p.dst} TTL ${p.ttl}`;
  if(p.udp&&p.udp.dhcp) return `DHCP ${p.udp.dhcp.type} ${p.src} → ${p.dst}${p.udp.dhcp.yiaddr?' ('+p.udp.dhcp.yiaddr+')':''}`;
  if(p.udp&&p.udp.rip) return `RIPv2 update ${p.src} → 224.0.0.9 (${p.udp.rip.entries.length} routes)`;
  return 'Frame';
}
function fcls(f){if(f.arp)return 'arp';const p=f.ip;if(p.icmp)return (p.icmp.type===3||p.icmp.type===11)?'err':'icmp';if(p.udp&&p.udp.dhcp)return 'dhcp';if(p.udp&&p.udp.rip)return 'rip';return 'mute'}
function sendFrame(d,ifi,f,explain,opt){
  const ifc=d.ifaces[ifi],L=linkAt(d,ifi);
  f=JSON.parse(JSON.stringify(f));f.id=sim.fid++;
  if(!L||!ifOper(d,ifi)){log(d,`Can't send on ${ifc.name}: ${!L?'no cable':'link down'}`,{frame:f,cls:'err',explain:`${d.name} can't send on ${ifc.name} because ${!L?'no cable is plugged in':'the link is down (check shutdown on both ends)'}. The frame is dropped.`});return false}
  const side=(L.a.dev===d.id&&L.a.ifi===ifi)?'a':'b',pe=peer(L,d,ifi);
  f.hop=`${d.name} ${ifc.name} → ${pe.d.name} ${pe.d.ifaces[pe.ifi].name}`;
  sim.packets.push({id:sim.pid++,f,link:L.id,from:side,p:0});
  if(!(opt&&opt.quiet)) log(d,fsum(f),{frame:f,cls:fcls(f),explain});
  return true;
}
function deliver(pk){const L=S.links.find(l=>l.id===pk.link);if(!L)return;const to=pk.from==='a'?L.b:L.a;const d=dev(to.dev);if(d)receive(d,to.ifi,pk.f)}

/* ---------- routing ---------- */
function routeLookup(d,dst){
  let best=null;const cand=r=>{if(!best||r.len>best.len||(r.len===best.len&&r.ad<best.ad))best=r};
  d.ifaces.forEach((i,k)=>{if(i.ip&&i.mask&&ifOper(d,k)&&inNet(dst,i.ip,i.mask))cand({ifi:k,nh:dst,len:mask2len(i.mask),net:netOf(i.ip,i.mask),kind:'C',ad:0})});
  if(d.type==='pc'){
    if(!best&&d.gw){const i=d.ifaces[0];if(i.ip&&ifOper(d,0)&&inNet(d.gw,i.ip,i.mask))best={ifi:0,nh:d.gw,len:0,net:'0.0.0.0',kind:'G',ad:0}}
  }else{
    const viaIf=nh=>d.ifaces.findIndex((i,k)=>i.ip&&i.mask&&ifOper(d,k)&&inNet(nh,i.ip,i.mask));
    d.routes.forEach(r=>{if(inNet(dst,r.net,r.mask)){const k=viaIf(r.nh);if(k>=0)cand({ifi:k,nh:r.nh,len:mask2len(r.mask),net:r.net,kind:'S',ad:1})}});
    d.ripRoutes.forEach(r=>{if(inNet(dst,r.net,r.mask)&&ifOper(d,r.ifi))cand({ifi:r.ifi,nh:r.nh,len:mask2len(r.mask),net:r.net,kind:'R',ad:120,metric:r.metric})});
  }
  return best;
}
function routeDesc(d,r){const n=d.ifaces[r.ifi].name;return r.kind==='C'?`${r.net}/${r.len} is directly connected on ${n}`:r.kind==='S'?`static route ${r.net}/${r.len} via ${r.nh} (out ${n})`:r.kind==='R'?`RIP route ${r.net}/${r.len} via ${r.nh}, ${r.metric} hop${r.metric>1?'s':''} (out ${n})`:`its default gateway ${r.nh}`}
function ipOut(d,pkt,explainFn){
  const r=routeLookup(d,pkt.dst);if(!r)return null;
  resolveAndSend(d,r,pkt,explainFn?explainFn(r):'');return r;
}
function resolveAndSend(d,r,pkt,explain){
  const ifc=d.ifaces[r.ifi],e=d.arp[r.nh];
  if(e){sendFrame(d,r.ifi,{dst:e.mac,src:ifc.mac,ip:pkt},`${explain} ${r.nh} is already in ${d.name}'s ARP cache (${e.mac}), so the frame goes straight to that MAC.`);return}
  d.pending.push({nh:r.nh,ifi:r.ifi,pkt,explain});
  if(!d.arpWait[r.nh]){
    d.arpWait[r.nh]=true;
    sendFrame(d,r.ifi,{dst:BCAST,src:ifc.mac,arp:{op:1,sha:ifc.mac,spa:ifc.ip,tha:ZMAC,tpa:r.nh}},`${explain} But ${d.name} has no ARP entry for ${r.nh}, so the packet waits while it broadcasts an ARP request: "Who has ${r.nh}? Tell ${ifc.ip}". The destination MAC ff:ff:ff:ff:ff:ff reaches every device on this LAN.`);
    const nh=r.nh;
    after(ARP_TIMEOUT,()=>{if(!d.arpWait[nh])return;delete d.arpWait[nh];const lost=d.pending.filter(p=>p.nh===nh);d.pending=d.pending.filter(p=>p.nh!==nh);
      log(d,`ARP for ${nh} timed out`,{cls:'err',explain:`Nobody answered ${d.name}'s ARP request for ${nh}, so ${lost.length} queued packet${lost.length===1?'':'s'} ${lost.length===1?'is':'are'} dropped. Check that ${nh} exists, is cabled, and its interface is up.`});
      lost.forEach(p=>sessionLocalFail(d,p.pkt,'Destination host unreachable.'));});
  }
}
function flushPending(d,ip){
  delete d.arpWait[ip];const e=d.arp[ip];if(!e)return;
  const q=d.pending.filter(p=>p.nh===ip);d.pending=d.pending.filter(p=>p.nh!==ip);
  q.forEach(p=>sendFrame(d,p.ifi,{dst:e.mac,src:d.ifaces[p.ifi].mac,ip:p.pkt},`ARP resolved ${ip} to ${e.mac}, so ${d.name} now sends the packet that was waiting: ${fsumIp(p.pkt)}.`));
}
const fsumIp=p=>p.icmp?`ICMP ${ICMPN[p.icmp.type]} ${p.src} → ${p.dst}`:`${p.src} → ${p.dst}`;

/* ---------- receive path ---------- */
function receive(d,ifi,f){
  const ifc=d.ifaces[ifi];
  if(!ifc.up){log(d,`Dropped on ${ifc.name} (shut down)`,{frame:f,cls:'err'});return}
  if(d.type==='switch')return swRx(d,ifi,f);
  const forMe=f.dst===ifc.mac||f.dst===BCAST||(f.dst===RIPMAC&&d.type==='router');
  if(!forMe){log(d,`Discarded frame for ${f.dst}`,{frame:f,cls:'mute',explain:`${d.name} received a copy of a frame addressed to ${f.dst}. That isn't its MAC address, so its network card discards it.`});return}
  if(f.arp)arpRx(d,ifi,f);else if(f.ip)ipRx(d,ifi,f);
}
function arpRx(d,ifi,f){
  const a=f.arp,ifc=d.ifaces[ifi];
  if(!ifc.ip||a.tpa!==ifc.ip){if(a.op===1)log(d,`Ignored ARP for ${a.tpa}`,{frame:f,cls:'mute',explain:`${d.name} received the broadcast ARP request too, but ${a.tpa} isn't its IP address, so it ignores it.`});return}
  d.arp[a.spa]={mac:a.sha,ifi,t:sim.t};panelDirty=true;
  if(a.op===1) sendFrame(d,ifi,{dst:a.sha,src:ifc.mac,arp:{op:2,sha:ifc.mac,spa:ifc.ip,tha:a.sha,tpa:a.spa}},`${d.name} owns ${a.tpa}, so it answers with a unicast ARP reply: "${a.tpa} is at ${ifc.mac}". It also saves ${a.spa} → ${a.sha} from the request in its own ARP cache.`);
  else log(d,`ARP cache: ${a.spa} → ${a.sha}`,{frame:f,cls:'arp',explain:`${d.name} stores ${a.spa} → ${a.sha} in its ARP cache, so next time it won't need to ask.`});
  flushPending(d,a.spa);
}
function isLocal(d,p){return d.ifaces.some(i=>i.ip&&i.ip===p.dst)||p.dst==='255.255.255.255'||(p.dst==='224.0.0.9'&&d.type==='router')}
function ipRx(d,ifi,f){
  const p=f.ip,ifc=d.ifaces[ifi];
  if(isLocal(d,p)){
    if(p.udp){
      if(p.udp.dp===67&&d.type==='router')return dhcpServerRx(d,ifi,f);
      if(p.udp.dp===68&&d.type==='pc')return dhcpClientRx(d,ifi,f);
      if(p.udp.dp===520&&d.type==='router')return ripRx(d,ifi,f);
      return log(d,`Ignored UDP port ${p.udp.dp}`,{frame:f,cls:'mute',explain:`${d.name} isn't running a service on UDP port ${p.udp.dp}, so it ignores this ${p.udp.dhcp?'DHCP':p.udp.rip?'RIP':''} message.`});
    }
    const ic=p.icmp;if(!ic)return;
    if(p.dst==='255.255.255.255')return;
    if(ic.type===8){
      const reply={src:p.dst,dst:p.src,ttl:d.type==='pc'?128:255,ident:sim.ident++,icmp:{type:0,code:0,id:ic.id,seq:ic.seq}};
      const r=ipOut(d,reply,r=>`The Echo Request reached ${d.name}. It answers ${p.src} with an ICMP Echo Reply (type 0). Path back: ${routeDesc(d,r)}.`);
      if(!r)log(d,`No route back to ${p.src}`,{frame:f,cls:'err',explain:`The request reached ${d.name}, but it has no route back to ${p.src}, so the reply can't be sent and the ping will time out. Check the default gateway or the return route.`});
      return;
    }
    if(!sessionRx(d,p,f))log(d,`${ICMPN[ic.type]} from ${p.src}`,{frame:f,cls:'mute'});
    return;
  }
  if(p.dst==='255.255.255.255'||p.dst.startsWith('224.'))return;
  if(d.type!=='router'){log(d,`Dropped packet for ${p.dst}`,{frame:f,cls:'mute',explain:`${d.name} is a host, not a router, so it drops packets addressed to someone else's IP.`});return}
  const isErr=p.icmp&&(p.icmp.type===3||p.icmp.type===11);
  if(p.ttl<=1){
    if(!isErr)icmpError(d,ifi,p,11,0,`The TTL reached 0 at ${d.name}, so it discards the packet and sends ICMP Time Exceeded (type 11) back to ${p.src}. Traceroute relies on this to discover each router along the path.`);
    else log(d,'TTL expired (ICMP error dropped)',{frame:f,cls:'err'});
    return;
  }
  const np={...p,ttl:p.ttl-1};
  const r=ipOut(d,np,r=>`${d.name} received a packet for ${p.dst} on ${ifc.name}. Best match in its routing table: ${routeDesc(d,r)}. It lowers the TTL from ${p.ttl} to ${p.ttl-1} and writes a new Ethernet header for the next link. The IP addresses (${p.src} → ${p.dst}) stay the same.`);
  if(!r){
    if(!isErr)icmpError(d,ifi,p,3,0,`${d.name} has no route to ${p.dst}. It drops the packet and sends ICMP Destination Unreachable (type 3, code 0: network unreachable) back to ${p.src}.`);
    else log(d,`No route to ${p.dst}, ICMP error dropped`,{frame:f,cls:'err'});
  }
}
function icmpError(d,ifi,orig,type,code,explain){
  const e={src:d.ifaces[ifi].ip,dst:orig.src,ttl:255,ident:sim.ident++,icmp:{type,code,orig}};
  if(!ipOut(d,e,()=>explain))log(d,`Can't return ICMP error to ${orig.src}: no route`,{cls:'err',explain:`${d.name} wanted to report an error to ${orig.src}, but it has no route back either.`});
}
function swRx(d,ifi,f){
  const port=d.ifaces[ifi].name,prev=d.mact[f.src];
  d.mact[f.src]={ifi,t:sim.t};panelDirty=true;
  const learn=!prev?`${d.name} learns that ${f.src} is reachable through ${port} and adds it to its MAC address table.`:prev.ifi!==ifi?`${f.src} has moved to ${port}, so ${d.name} updates its MAC table.`:`${d.name} already knows ${f.src} is on ${port}.`;
  const multi=f.dst===BCAST||f.dst.startsWith('01:00:5e');
  const known=!multi&&d.mact[f.dst];
  if(!known){
    const outs=d.ifaces.map((_,k)=>k).filter(k=>k!==ifi&&ifOper(d,k));
    outs.forEach(k=>sendFrame(d,k,f,null,{quiet:true}));
    const names=outs.map(k=>d.ifaces[k].name).join(', ')||'no other active ports';
    const why=f.dst===BCAST?'The destination is the broadcast address':multi?'The destination is a multicast address':`${f.dst} isn't in the MAC table yet (unknown unicast)`;
    log(d,`Flood → ${names}`,{frame:f,cls:'sw',explain:`${learn} ${why}, so it floods the frame out every other active port: ${names}.`});
  }else if(known.ifi===ifi){
    log(d,`Filtered frame for ${f.dst}`,{frame:f,cls:'sw',explain:`${learn} ${f.dst} is on the same port the frame came from, so ${d.name} filters (drops) it.`});
  }else{
    sendFrame(d,known.ifi,f,null,{quiet:true});
    log(d,`Forward → ${d.ifaces[known.ifi].name}`,{frame:f,cls:'sw',explain:`${learn} Its MAC table says ${f.dst} is on ${d.ifaces[known.ifi].name}, so it forwards the frame out that one port only.`});
  }
}

/* ---------- ping / traceroute sessions ---------- */
function startPing(d,dst,count,style){
  if(!validIp(dst))return tprint(d,style==='win'?`Ping request could not find host ${dst}.`:'% Unrecognized host or address.');
  if(d.session)return tprint(d,'A ping or trace is already running. Press Ctrl+C to stop it.');
  d.session={kind:'ping',dst,count,seq:0,ok:0,id:1+Math.floor(Math.random()*65000),style,tok:null};
  if(style==='win')tprint(d,`\nPinging ${dst} with 32 bytes of data:`);
  else{tprint(d,'Type escape sequence to abort.');tprint(d,`Sending ${count}, 100-byte ICMP Echos to ${dst}, timeout is 2 seconds:`);tprint(d,'')}
  nextProbe(d);
}
function startTrace(d,dst,style){
  if(!validIp(dst))return tprint(d,`Unable to resolve target system name ${dst}.`);
  if(d.session)return tprint(d,'A ping or trace is already running. Press Ctrl+C to stop it.');
  d.session={kind:'trace',dst,count:15,seq:0,id:1+Math.floor(Math.random()*65000),style,tok:null};
  if(style==='win')tprint(d,`\nTracing route to ${dst} over a maximum of 15 hops:\n`);

function sessionRx(d,p,f){

/* ---------- DHCP ---------- */
const DHCPT={DISCOVER:1,OFFER:2,REQUEST:3,ACK:5,NAK:6};
function startDhcp(d){

  const xid=(Math.random()*0xffffffff)>>>0;d.dhcpc={xid,state:'selecting'};
  tprint(d,'DHCP: sending DISCOVER…');
  dhcpSend(d,{type:'DISCOVER',xid,chaddr:d.ifaces[0].mac},`${d.name} has no IP address yet, so it broadcasts a DHCP DISCOVER from 0.0.0.0 to 255.255.255.255 (UDP 68 → 67), asking any DHCP server for an address.`);
  after(DHCP_TIMEOUT,()=>{if(d.dhcpc&&d.dhcpc.xid===xid&&d.dhcpc.state!=='bound'){d.dhcpc=null;tprint(d,"DHCP: no response from any server. Check the router's ip dhcp pool.");log(d,'DHCP timed out',{cls:'err'})}});
}
function dhcpSend(d,msg,explain){sendFrame(d,0,{dst:BCAST,src:d.ifaces[0].mac,ip:{src:'0.0.0.0',dst:'255.255.255.255',ttl:128,ident:sim.ident++,udp:{sp:68,dp:67,dhcp:msg}}},explain)}
function dhcpClientRx(d,ifi,f){
  const m=f.ip.udp.dhcp,c=d.dhcpc;

  if(m.type==='OFFER'&&c.state==='selecting'){
    c.state='requesting';tprint(d,`DHCP: OFFER ${m.yiaddr} from ${m.siaddr}. Sending REQUEST…`);
    dhcpSend(d,{type:'REQUEST',xid:c.xid,chaddr:d.ifaces[0].mac,requested:m.yiaddr,server:m.siaddr},`${d.name} accepts the offer of ${m.yiaddr}. It broadcasts a DHCP REQUEST naming server ${m.siaddr}, so any other servers know their offers were declined.`);
  }else if(m.type==='ACK'&&c.state==='requesting'){
    c.state='bound';const i=d.ifaces[0];i.ip=m.yiaddr;i.mask=m.mask;d.gw=m.router||'';topoDirty=panelDirty=true;save();
    tprint(d,`DHCP: ACK. IP ${m.yiaddr}/${mask2len(m.mask)}  gateway ${m.router||'none'}  lease ${m.lease/3600} h`);
    log(d,`Bound to ${m.yiaddr}`,{frame:f,cls:'dhcp',explain:`The DHCP ACK confirms the lease. ${d.name} now uses ${m.yiaddr}/${mask2len(m.mask)} with gateway ${m.router||'none'}. That completes D-O-R-A: Discover, Offer, Request, Acknowledge.`});

function dhcpServerRx(d,ifi,f){
  const m=f.ip.udp.dhcp,ifc=d.ifaces[ifi];

  const reply=(type,extra,explain)=>sendFrame(d,ifi,{dst:BCAST,src:ifc.mac,ip:{src:ifc.ip,dst:'255.255.255.255',ttl:255,ident:sim.ident++,udp:{sp:67,dp:68,dhcp:{type,xid:m.xid,chaddr:m.chaddr,siaddr:ifc.ip,mask:pool.mask,router:pool.gw||'',lease:86400,...extra}}}},explain);

function allocate(d,pool,mac){

/* ---------- RIPv2 ---------- */
function ripIfs(d){return d.ifaces.map((_,k)=>k).filter(k=>{const i=d.ifaces[k];return i.ip&&i.mask&&ifOper(d,k)&&d.rip.nets.some(n=>inNet(i.ip,n,classful(n)))})}
function ripSend(d){
  const ifs=ripIfs(d);
  ifs.forEach(k=>{
    const ifc=d.ifaces[k],entries=[];
    ifs.forEach(j=>{if(j!==k){const i=d.ifaces[j];entries.push({net:netOf(i.ip,i.mask),mask:i.mask,metric:1})}});
    d.ripRoutes.forEach(r=>{if(r.ifi!==k&&!entries.some(e=>e.net===r.net&&e.mask===r.mask))entries.push({net:r.net,mask:r.mask,metric:r.metric})});
    if(!entries.length)return;
    const list=entries.map(e=>`${e.net}/${mask2len(e.mask)} (${e.metric})`).join(', ');
    sendFrame(d,k,{dst:RIPMAC,src:ifc.mac,ip:{src:ifc.ip,dst:'224.0.0.9',ttl:2,ident:sim.ident++,udp:{sp:520,dp:520,rip:{cmd:2,entries}}}},
      `${d.name} sends a RIPv2 update out ${ifc.name} to the multicast address 224.0.0.9 (UDP 520). It advertises ${list}. Split horizon: routes learned on ${ifc.name} aren't sent back out ${ifc.name}. Real routers do this every 30 s; this lab uses a shorter interval.`);

}
function ripRx(d,ifi,f){

function ripTick(){
  S.devices.forEach(d=>{

/* ---------- terminal ---------- */
function tprint(d,s){String(s).split('\n').forEach(l=>d.term.lines.push(l));if(d.term.lines.length>500)d.term.lines.splice(0,d.term.lines.length-500);if(d.id===selId)termDirty=true}

let termDirty=true;
function promptOf(d){
  if(d.type==='pc')return d.name+'> ';
  const m=d.term.mode;return d.name+({user:'>',priv:'#',config:'(config)#',if:'(config-if)#',dhcp:'(dhcp-config)#',rip:'(config-router)#'}[m]);

function runCmd(d,line,echo=true){

function pcCmd(d,line){

  const c=t[0].toLowerCase(),i=d.ifaces[0];

    '  ipconfig                          show IP settings',
    '  ip <addr>/<len> [gateway]         set a static address, e.g. ip 192.168.1.10/24 192.168.1.1',
    '  ip <addr> <mask> [gateway]        same, with a dotted mask',

    '  tracert <ip>                      list every router on the path',

    'Press Ctrl+C to stop a running ping.'].join('\n'));
  if(c==='ipconfig'){
    if(t[1]==='/renew')return startDhcp(d);

  }

    if(gw&&!inNet(gw,a.ip,a.mask))tprint(d,`Warning: gateway ${gw} is not in ${netOf(a.ip,a.mask)}/${mask2len(a.mask)}. It won't be reachable.`);

function matchCmd(toks,pat){

const IOSHELP={

function linkMsg(d,ifi){const i=d.ifaces[ifi],L=longIf(i.name);

           {dev:'PC1',cmds:['arp -a'],text:'Look at PC1\'s ARP cache. The mapping it learned saves it from asking again for the next packets.'}],
    outro:'ARP turned an IP address into a MAC address with one broadcast and one unicast reply. PC3 saw the request but stayed silent because it wasn\'t the target.'},
  mac:{title:'How a switch learns MAC addresses',step:true,build(){const sw=mk('switch','SW1',600,360),a=mk('pc','PC1',260,170),b=mk('pc','PC2',940,170),c=mk('pc','PC3',260,560),e=mk('pc','PC4',940,560);ln(a,0,sw,0);ln(b,0,sw,1);ln(c,0,sw,2);ln(e,0,sw,3);pcip(a,'192.168.1.10/24');pcip(b,'192.168.1.20/24');pcip(c,'192.168.1.30/24');pcip(e,'192.168.1.40/24')},
    steps:[{dev:'PC1',cmds:['ping 192.168.1.30 -n 1'],text:'The switch\'s MAC table starts empty. When PC1\'s ARP broadcast arrives, the switch learns PC1\'s port and floods the frame. The reply from PC3 is then forwarded to one port only.'},
           {dev:'SW1',cmds:['enable','show mac address-table'],text:'Check what SW1 has learned so far.'},
           {dev:'SW1',cmds:['enable','clear mac address-table'],text:'Now wipe the MAC table but keep the PCs\' ARP caches. The next ping is unicast to a MAC the switch no longer knows.'},
           {dev:'PC1',cmds:['ping 192.168.1.30 -n 1'],text:'Watch the unknown unicast flood: PC2 and PC4 receive a frame that isn\'t for them and discard it. After the reply, the switch knows both ports again.'}],
    outro:'Switches learn from source MACs and forward on destination MACs. Unknown destinations and broadcasts are flooded.'},
  routing:{title:'Routing between two subnets',step:true,build:twoLans,
    steps:[{dev:'PC1',cmds:['ping 192.168.2.10 -n 1'],text:'PC3 is on a different subnet, so PC1 sends the packet to its default gateway R1. Watch how R1 rewrites the Ethernet header at each hop while the IP addresses stay the same.'},
           {dev:'R1',cmds:['enable','show ip route'],text:'R1 knows both subnets because they\'re directly connected (C routes).'}],
    outro:'Hosts send off-subnet traffic to the gateway; routers pick the outgoing interface from the routing table and rebuild the Layer 2 header for each link.'},
  dhcp:{title:'DHCP: getting an address automatically',step:true,build(){const pc1=mk('pc','PC1',200,190),pc2=mk('pc','PC2',200,500),sw=mk('switch','SW1',500,340),r1=mk('router','R1',820,340);ln(pc1,0,sw,0);ln(pc2,0,sw,1);ln(sw,7,r1,0);rif(r1,0,'192.168.10.1/24');r1.dhcp.excluded.push(['192.168.10.1','192.168.10.99']);r1.dhcp.pools.push({name:'LAN',net:'192.168.10.0',mask:'255.255.255.0',gw:'192.168.10.1',dns:''})},
    steps:[{dev:'PC1',cmds:['ip dhcp'],text:'PC1 has no address. R1 runs a DHCP pool for 192.168.10.0/24, with .1 to .99 excluded. Follow the four messages: <b>D</b>iscover, <b>O</b>ffer, <b>R</b>equest, <b>A</b>cknowledge. All of them are broadcasts.'},
           {dev:'R1',cmds:['enable','show ip dhcp binding'],text:'R1 now has a lease binding for PC1\'s MAC address.'},
           {dev:'PC1',cmds:['ping 192.168.10.1 -n 1'],text:'With its leased address and gateway, PC1 can reach R1.'}],
    outro:'DHCP handed out the IP, mask and gateway in four messages, with no manual configuration.'},
  trace:{title:'Traceroute and TTL',step:false,build(){chain(true)},
    steps:[{dev:'PC1',cmds:['tracert 10.3.0.10'],text:'Traceroute sends probes with TTL 1, 2, 3… Each router that drops a probe with TTL 0 reports back with ICMP Time Exceeded, which reveals the path one hop at a time.'}],
    outro:'Every hop on the path was found from the source address of its Time Exceeded message.'},
  broken:{title:'Troubleshoot a missing route',step:false,build(){chain(true,true)},
    steps:[{dev:'PC1',cmds:['ping 10.3.0.10 -n 2'],text:'Something is wrong on this network. Ping PC2 and read the reply carefully: who answers?'},
           {dev:'R2',cmds:['enable','show ip route'],text:'R2 sent "Destination net unreachable". Check its routing table: is there a route to 10.3.0.0/24?'},
           {dev:'R2',cmds:['enable','configure terminal','ip route 10.3.0.0 255.255.255.0 10.0.23.2','end'],label:'ip route 10.3.0.0 255.255.255.0 10.0.23.2',text:'Add the missing static route on R2, pointing at R3 (10.0.23.2).'},
           {dev:'PC1',cmds:['ping 10.3.0.10 -n 2'],text:'Ping again to verify the fix.'}],
    outro:'Fixed. ICMP Unreachable tells you which router is missing a route, so you know where to look.'},
  rip:{title:'RIPv2: routers learning routes',step:false,build(){chain(false)},
    steps:[{dev:'R1',cmds:RIPCMDS,label:'router rip · network 10.0.0.0',text:'None of the routers has a route to the far subnets yet. Enable RIPv2 on R1 for network 10.0.0.0.'},
           {dev:'R2',cmds:RIPCMDS,label:'router rip · network 10.0.0.0',text:'Now enable RIP on R2. Watch the RIP updates (teal) to 224.0.0.9 and the routes appear in each routing table.'},
           {dev:'R3',cmds:RIPCMDS,label:'router rip · network 10.0.0.0',text:'Enable RIP on R3. Triggered updates spread the new routes quickly.'},
           {dev:'R1',cmds:['enable','show ip route'],text:'R1 should now show R routes such as 10.3.0.0/24 [120/2]: administrative distance 120, metric 2 hops.'},
           {dev:'PC1',cmds:['ping 10.3.0.10 -n 2'],text:'End-to-end reachability, with no static routes configured.'}],
    outro:'RIP routers advertise what they know to their neighbours, add one hop per router, and use split horizon to avoid sending routes back where they came from.'}
};
const sel=$('#demoSel');Object.entries(DEMOS).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.title;sel.appendChild(o)});
const so=document.createElement('option');so.value='__sample';so.textContent='Reset to sample lab (two LANs)';sel.appendChild(so);
sel.onchange=()=>{const k=sel.value;if(!k)return;if(k==='__sample'){clearAll();twoLans();narr.demo=null;sel.value='';save();toast('Sample lab loaded.');return}startDemo(k)};
function startDemo(k){
  const D=DEMOS[k];clearAll();D.build();sim.packets=[];
  narr.demo=D;narr.step=0;narr.lines=[];narr.min=false;
  sim.stepMode=D.step;$('#stepMode').checked=D.step;sim.running=true;updCtl();
  topoDirty=panelDirty=narrDirty=true;save();
}
function runDemoStep(){
  const D=narr.demo,st=D&&D.steps[narr.step];if(!st)return;const d=devByName(st.dev);if(!d)return toast(`${st.dev} isn't on the canvas anymore.`);
  selId=d.id;setTab('device');renderDevicePane(true);
  if(d.type!=='pc')d.term.mode='user';
  narr.lines=[];
  st.cmds.forEach(c=>runCmd(d,c));
  narr.step++;narrDirty=true;afterUserCmd();
}

/* ---------- main loop ---------- */
let last=performance.now(),panelTick=0;
function frame(now){
  const dt=Math.min(now-last,100);last=now;
  if(sim.running){
    const d=dt*sim.speed;sim.t+=d;
    const due=sim.timers.filter(x=>x.at<=sim.t);if(due.length){sim.timers=sim.timers.filter(x=>x.at>sim.t);due.sort((a,b)=>a.at-b.at).forEach(x=>x.fn())}
    ripTick();
    const arrived=[];for(const p of sim.packets){p.p+=d/HOP_MS;if(p.p>=1)arrived.push(p)}
    if(arrived.length){sim.packets=sim.packets.filter(p=>p.p<1);arrived.forEach(deliver);
      if(sim.stepMode||sim.stepOnce){sim.running=false;sim.stepOnce=false;updCtl()}}
    $('#clock').textContent='t '+(sim.t/1000).toFixed(1)+' s';
  }
  if(topoDirty)renderTopo();
  renderPackets();
  panelTick+=dt;
  if((panelDirty||termDirty)&&panelTick>150){panelTick=0;panelDirty=false;if(tab==='device')renderDevicePane()}
  if(narrDirty)renderNarr();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
let restored=false;
try{const s=localStorage.getItem('packetyard.topo');if(s){const o=JSON.parse(s);if(o&&o.devices&&o.devices.length){load(o);restored=true}}}catch(e){}
if(!restored){twoLans();save()}
setTool('select');updCtl();renderDevicePane(true);renderInspector();
requestAnimationFrame(frame);
})();
</script>
